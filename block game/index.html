<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>BlockForge — 3D Voxel Builder</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Loading Screen -->
  <div id="loading-screen" class="screen active">
    <div class="loading-content">
      <div class="logo">BLOCK<span>FORGE</span></div>
      <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
      <div class="loading-text" id="loading-text">Booting voxel engine…</div>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="main-menu" class="screen">
    <div class="menu-content">
      <div class="logo">BLOCK<span>FORGE</span></div>
      <div class="subtitle">Build. Explore. Create.</div>
      <div class="menu-buttons">
        <button class="menu-btn primary" id="btn-play">Play</button>
        <button class="menu-btn" id="btn-load">Load World</button>
        <button class="menu-btn" id="btn-settings">Settings</button>
        <button class="menu-btn" id="btn-fullscreen">Fullscreen</button>
      </div>
      <div class="menu-footer">v1.0 · Three.js voxel engine</div>
    </div>
  </div>

  <!-- New World Dialog -->
  <div id="new-world-dialog" class="screen">
    <div class="dialog">
      <h2>New World</h2>
      <div class="form-row">
        <label for="seed-input">Seed</label>
        <input id="seed-input" type="text" placeholder="random" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="mode-select">Game Mode</label>
        <select id="mode-select">
          <option value="creative">Creative — fly, infinite blocks</option>
          <option value="survival">Survival — gravity, collect blocks</option>
          <option value="free">Free Building — gravity, infinite blocks</option>
        </select>
      </div>
      <div class="dialog-buttons">
        <button class="menu-btn primary" id="btn-create">Create World</button>
        <button class="menu-btn" id="btn-cancel-new">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Settings Dialog -->
  <div id="settings-dialog" class="screen">
    <div class="dialog">
      <h2>Settings</h2>
      <div class="form-row">
        <label for="sens-input">Mouse Sensitivity</label>
        <input id="sens-input" type="range" min="0.2" max="3" step="0.1" value="1">
        <span class="value-badge" id="sens-value">1.0</span>
      </div>
      <div class="form-row">
        <label for="render-input">Render Distance</label>
        <input id="render-input" type="range" min="2" max="8" step="1" value="5">
        <span class="value-badge" id="render-value">5</span>
      </div>
      <div class="form-row">
        <label for="vol-input">Master Volume</label>
        <input id="vol-input" type="range" min="0" max="1" step="0.05" value="0.6">
        <span class="value-badge" id="vol-value">0.6</span>
      </div>
      <div class="form-row">
        <label for="fov-input">Field of View</label>
        <input id="fov-input" type="range" min="60" max="110" step="1" value="75">
        <span class="value-badge" id="fov-value">75</span>
      </div>
      <div class="form-row">
        <label for="shadow-input">Shadows</label>
        <input id="shadow-input" type="checkbox" checked>
      </div>
      <div class="dialog-buttons">
        <button class="menu-btn primary" id="btn-settings-close">Done</button>
      </div>
    </div>
  </div>

  <!-- Load World Dialog -->
  <div id="load-dialog" class="screen">
    <div class="dialog">
      <h2>Load World</h2>
      <div id="world-list" class="world-list"></div>
      <div class="dialog-buttons">
        <button class="menu-btn" id="btn-load-close">Close</button>
      </div>
    </div>
  </div>

  <!-- Game HUD -->
  <div id="game-hud" class="hidden">
    <div class="crosshair"><div class="crosshair-dot"></div></div>
    <div id="hotbar" class="hotbar"></div>
    <div id="game-info" class="game-info"></div>
    <div class="hint" id="hint">Click to lock · WASD move · Space jump · LMB break · RMB place · E inventory · Esc pause</div>
    <!-- Mobile controls (shown only on touch) -->
    <div id="mobile-controls" class="mobile-controls hidden">
      <div id="joystick-base" class="joystick-base">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
      <div class="mobile-actions">
        <button class="mob-btn" id="mob-jump">↑</button>
        <button class="mob-btn" id="mob-place">Place</button>
        <button class="mob-btn" id="mob-break">Break</button>
      </div>
    </div>
  </div>

  <!-- Pause Menu -->
  <div id="pause-menu" class="screen">
    <div class="dialog">
      <h2>Paused</h2>
      <div class="dialog-buttons">
        <button class="menu-btn primary" id="btn-resume">Resume</button>
        <button class="menu-btn" id="btn-save">Save World</button>
        <button class="menu-btn" id="btn-settings-game">Settings</button>
        <button class="menu-btn" id="btn-quit">Quit to Menu</button>
      </div>
    </div>
  </div>

  <!-- Inventory Screen -->
  <div id="inventory-screen" class="screen">
    <div class="dialog inventory-dialog">
      <h2>Inventory</h2>
      <div id="inventory-grid" class="inventory-grid"></div>
      <div class="dialog-buttons">
        <button class="menu-btn" id="btn-inv-close">Close</button>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
